name: Module Release (publish)

# Tag-driven publish of the native module to the `dist` branch - the PixInsight
# update-repository URL users add:
#   https://raw.githubusercontent.com/pardovot/pixinsight-mcp/dist/
#
# Flow:
#   1. preflight - assert the tag matches module/src/Version.h (the guard against
#      forgetting to bump, or republishing a version PixInsight won't re-deliver).
#   2. build     - reuse module-build.yml to build all three OS binaries.
#   3. publish   - sign each binary, assemble pi-repo/, and force-push it to the
#      single-commit `dist` branch. Signing runs here, with no PixInsight on the
#      runner: see docs/SIGNING.md. Needs the PI_SIGN_KEY and PI_SIGN_DEVELOPER_ID
#      repository secrets; without them the job fails rather than publishing
#      unsigned modules, which PixInsight would refuse to install anyway.
#
# To cut a release:  bump module/src/Version.h, commit, then
#   git tag module-v<version> && git push --tags
# See docs/RELEASING.md.
#
# CHANNELS. A tag always publishes to `dist`, the production repository. A manual
# run defaults to the `dist-sandbox` channel instead, which is a second
# repository URL you add in PixInsight while testing. Sandbox exercises what a
# local `module:install` cannot: the signature, updates.xri, the zip layout and
# PixInsight's own install flow, which is where the macOS packaging bug of
# 2026-08-11 would have surfaced. PixInsight's repository reference recommends
# exactly this ("Testing Updates: Sandbox Repositories").

on:
  push:
    tags: ["module-v*"]
  workflow_dispatch:
    inputs:
      channel:
        description: "Which repository to publish to"
        type: choice
        options: [sandbox, production]
        default: sandbox

# Serialize releases so two never race on a dist branch.
concurrency:
  group: module-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    # Fork consumes the original author's signed Watcher; it does not publish modules.
    if: github.repository == 'pardovot/pixinsight-mcp'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      branch: ${{ steps.channel.outputs.branch }}
      channel: ${{ steps.channel.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: ver
        shell: bash
        run: |
          VER=$(sed -n 's/.*MCPWATCHER_VERSION_STR[[:space:]]*"\([^"]*\)".*/\1/p' module/src/Version.h)
          [ -n "$VER" ] || { echo "::error::Could not read MCPWATCHER_VERSION_STR from Version.h"; exit 1; }
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Version.h = $VER"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGVER="${GITHUB_REF_NAME#module-v}"
            if [ "$TAGVER" != "$VER" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} (=$TAGVER) != Version.h (=$VER). Bump Version.h or retag."
              exit 1
            fi
            echo "Tag matches Version.h ($VER)."
          else
            echo "Manual dispatch - publishing Version.h version $VER."
          fi
      # A tag is always production. A manual run is sandbox unless it explicitly
      # says otherwise, so the accident-prone direction is the safe one.
      - id: channel
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            CHANNEL=production
          else
            CHANNEL="${{ inputs.channel || 'sandbox' }}"
          fi
          case "$CHANNEL" in
            production) BRANCH=dist ;;
            sandbox)    BRANCH=dist-sandbox ;;
            *) echo "::error::Unknown channel '$CHANNEL'"; exit 1 ;;
          esac
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "Publishing to the $CHANNEL channel, branch $BRANCH."

  # Reuse the compile-check workflow so the release build can never drift from it.
  # contents: write is for the prebuilt PCL SDK release asset that workflow
  # publishes; a reusable workflow cannot widen the caller's permissions.
  build:
    needs: preflight
    permissions:
      contents: write
    uses: ./.github/workflows/module-build.yml

  publish:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the dist branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'

      - name: Download built module binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dl
          pattern: MCPWatcher-pxm-*
          merge-multiple: true

      # One directory per platform: the signature file name is derived from the
      # binary, so all three in one directory would collide on a single .xsgn.
      - name: Stage binaries for packaging
        run: |
          for pair in "windows:dll" "linux:so" "macosx:dylib"; do
            os="${pair%%:*}"; ext="${pair##*:}"
            found=$(find dl -type f -name "MCPWatcher-pxm.${ext}" | head -1)
            if [ -n "$found" ]; then
              mkdir -p "module/build/${os}"
              cp "$found" "module/build/${os}/MCPWatcher-pxm.${ext}"
            fi
          done
          echo "Staged:"; find module/build -type f

      - name: Sign each platform's module
        env:
          PI_SIGN_KEY: ${{ secrets.PI_SIGN_KEY }}
          PI_SIGN_DEVELOPER_ID: ${{ secrets.PI_SIGN_DEVELOPER_ID }}
        run: |
          if [ -z "$PI_SIGN_KEY" ]; then
            echo "::error::PI_SIGN_KEY is not set. An unsigned module cannot be installed; refusing to publish."
            exit 1
          fi
          find module/build -type f \( -name '*.dll' -o -name '*.so' -o -name '*.dylib' \) \
            -exec node module/sign.mjs {} +
          find module/build -type f \( -name '*.dll' -o -name '*.so' -o -name '*.dylib' \) \
            -exec node module/sign.mjs --verify {} +

      - name: Assemble pi-repo
        run: node scripts/build-pi-repo.mjs

      # The repository index carries its own signature, over a canonical
      # rendering of the root element rather than the file bytes. Unsigned, it
      # only prompts, but there is no reason to ship it unsigned now.
      - name: Sign the repository index
        env:
          PI_SIGN_KEY: ${{ secrets.PI_SIGN_KEY }}
          PI_SIGN_DEVELOPER_ID: ${{ secrets.PI_SIGN_DEVELOPER_ID }}
        run: |
          node module/sign-xri.mjs pi-repo/updates.xri
          node module/sign-xri.mjs --verify pi-repo/updates.xri

      - name: Publish pi-repo to the channel branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ needs.preflight.outputs.branch }}
          CHANNEL: ${{ needs.preflight.outputs.channel }}
        run: |
          cd pi-repo
          # Fresh init each publish, so the branch stays a single commit and no
          # binary history accumulates. Force-push overwrites the previous one.
          git init -q -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publish MCP Watcher module v${{ needs.preflight.outputs.version }} to $CHANNEL (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
          URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${BRANCH}/"
          echo "Published v${{ needs.preflight.outputs.version }} to the $CHANNEL channel"
          echo "Repository URL: $URL"
          {
            echo "### Published to \`$CHANNEL\`"
            echo ""
            echo "Version **${{ needs.preflight.outputs.version }}**, branch \`$BRANCH\`."
            echo ""
            echo "PixInsight repository URL:"
            echo ""
            echo "    $URL"
          } >> "$GITHUB_STEP_SUMMARY"
