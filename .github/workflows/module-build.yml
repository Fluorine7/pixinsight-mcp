name: Module Build (compile check)

# Builds the native PixInsight module on all three OSes to prove it COMPILES.
# It publishes NOTHING (see the planned release workflow + docs/RELEASING.md) and
# needs no version bump - building is not publishing.
#
# Why this exists: the macOS/Linux build branches have never been run. This is
# where we discover and fix them. Expect Windows green first; macOS/Linux to
# need iteration (linker/toolchain, and the PCL clone layout below).
#
# Runners have no PixInsight, so PCL - the SDK the module links against - is
# cloned from the official open-source repo (gitlab.com/pixinsight/PCL) and its
# location is fed to the existing build scripts via env vars
# (PI_ROOT/PCLINCDIR/PCLSRCDIR are all overridable in module/config.mjs - so NO
# change to that file is needed).
#
# NOTE - Windows PCL project: the public PCL repo ships the Linux/macOS build
# projects (src/pcl/{linux,macosx}/g++) but NOT the Windows vc17 project
# (src/pcl/windows/vc17/PCL.vcxproj is absent). We vendor it in
# module/vendor/pcl-vc17/ and overlay it into the clone below (Windows only).
#
# NOTE - macOS is a UNIVERSAL build: the runner (Apple Silicon) builds both the
# arm64 and the x86_64 slice, of PCL and of the module, and lipo joins them.
# The extra slice is why one runner can serve both architectures, clang
# cross-compiles either way and CI never executes the binary.

on:
  # Reusable: the release workflow (module-release.yml) calls this to build all
  # three binaries before publishing.
  workflow_call: {}
  workflow_dispatch:
    inputs:
      pcl_ref:
        description: "PixInsight/PCL git ref (blank = default branch)"
        required: false
        default: ""
  pull_request:
    paths:
      - "module/**"
      - "pjsr/pixinsight-mcp-watcher.js"
      - ".github/workflows/module-build.yml"
  push:
    branches: [master]
    paths:
      - "module/**"
      - "pjsr/pixinsight-mcp-watcher.js"
      - ".github/workflows/module-build.yml"

# Rapid pushes to the same ref cancel superseded runs instead of stacking.
concurrency:
  group: module-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Fork consumes the original author's signed Watcher; it does not publish modules.
    if: github.repository == 'pardovot/pixinsight-mcp'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Needed to store the prebuilt PCL SDK as a release asset (see below). A
    # reusable-workflow caller must grant this too, module-release.yml does.
    permissions:
      contents: write
    env:
      # PCL is cloned here; config.mjs derives PCLINCDIR=<PI_ROOT>/include and
      # PCLSRCDIR=<PI_ROOT>/src from it. The compiled static lib goes to the
      # default writable ~/pcl-build (see config.mjs pclBuildOut), which is what
      # gets stored and restored.
      PI_ROOT: ${{ github.workspace }}/pcl
      # Release holding the prebuilt PCL libraries. Not a product release.
      PCL_SDK_TAG: pcl-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clone PCL SDK
        shell: bash
        run: |
          git clone --depth 1 https://gitlab.com/pixinsight/PCL.git pcl
          if [ -n "${{ github.event.inputs.pcl_ref }}" ]; then
            git -C pcl fetch --depth 1 origin "${{ github.event.inputs.pcl_ref }}"
            git -C pcl checkout FETCH_HEAD
          fi
          echo "PCL_SHA=$(git -C pcl rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Overlay vendored Windows vc17 project (absent from public PCL)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p pcl/src/pcl/windows/vc17
          cp module/vendor/pcl-vc17/PCL.vcxproj module/vendor/pcl-vc17/PCL.vcxproj.filters \
             pcl/src/pcl/windows/vc17/

      # PCL SDK STORE - why this is a release asset and not actions/cache.
      #
      # PCL is content-addressed: the static library depends only on the PCL
      # commit, never on our branch. actions/cache cannot express that. It
      # partitions every entry by the ref that wrote it (a security boundary,
      # cache entries are attacker-writable, so a run may read only its own ref,
      # its PR base, or the default branch) and there is no way to opt out. That
      # partitioning bought nothing here and cost a 9-13 min rebuild per OS on
      # every new ref: the module-v1.3.2 and v1.3.3 caches were written under
      # refs/tags/... and show last_accessed_at == created_at, never read once.
      #
      # Release assets are repo-scoped, so ONE upload per PCL commit serves every
      # branch, tag, PR and release forever, with no eviction and no dependency
      # on which branch happens to be the default.
      - name: Restore prebuilt PCL
        id: pcl-sdk
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="pcl-${{ runner.os }}-${PCL_SHA:0:12}.tar.gz"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          # The archive path must stay RELATIVE. GNU tar reads an absolute
          # Windows path as a remote host spec (`D:\a\_temp/x.tar.gz` -> host
          # "D"), and macOS ships bsdtar, which has no --force-local to turn
          # that off. A relative name has no colon, so both are happy.
          mkdir -p .pcl-sdk
          if gh release download "$PCL_SDK_TAG" --repo "$GITHUB_REPOSITORY" \
               --pattern "$asset" --dir .pcl-sdk 2>/dev/null; then
            mkdir -p "$HOME/pcl-build"
            tar -xzf ".pcl-sdk/$asset" -C "$HOME/pcl-build"
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "Restored $asset, skipping the PCL build."
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "No prebuilt PCL for ${PCL_SHA:0:12} on ${{ runner.os }}; building and publishing it."
          fi

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # Establish the MSVC x64 dev environment for the whole job. build.mjs
      # detects VCINSTALLDIR and uses this directly instead of re-running vcvars,
      # which on the runner didn't put cl.exe on PATH for CMake. cmake/ninja come
      # from the VS install (config.mjs locates them via vswhere).
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Use the runner's system cmake, not the VS-bundled one config.mjs picks by
      # default - the bundled cmake can't detect cl.exe with -G Ninja. Pass its
      # FULL PATH: Node's spawnSync (shell:false, custom env) won't resolve a bare
      # "cmake"/"cmake.exe" on PATH here (spawn ENOENT); an absolute path needs no
      # PATH lookup. Get-Command returns the first on PATH = system cmake.
      - name: Use system cmake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cmake = (Get-Command cmake.exe).Source
          Write-Host "Using cmake: $cmake"
          "CMAKE=$cmake" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build PCL static library
        run: node module/build-pcl.mjs

      # Publish right after PCL builds - BEFORE the module build that might still
      # fail - so a failed run still leaves the SDK cached for the next attempt.
      # Skipped for fork PRs, whose GITHUB_TOKEN is read-only, they just build it.
      - name: Publish prebuilt PCL
        if: steps.pcl-sdk.outputs.hit != 'true' && github.event.pull_request.head.repo.fork != true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.pcl-sdk.outputs.asset }}
        run: |
          mkdir -p .pcl-sdk
          tar -czf ".pcl-sdk/$ASSET" -C "$HOME/pcl-build" lib # relative, see the restore step
          # Three OS jobs race to create the release, losing the race is fine.
          gh release view "$PCL_SDK_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$PCL_SDK_TAG" --repo "$GITHUB_REPOSITORY" --prerelease \
                 --title "PCL SDK build cache" \
                 --notes "Prebuilt PCL static libraries keyed by PCL commit, consumed by module-build.yml. Not a product release; see docs/RELEASING.md." \
            || true
          uploaded=false
          for attempt in 1 2 3; do
            if gh release upload "$PCL_SDK_TAG" ".pcl-sdk/$ASSET" \
                 --repo "$GITHUB_REPOSITORY" --clobber; then
              uploaded=true
              break
            fi
            echo "upload attempt $attempt failed (the release may still be appearing), retrying"
            sleep 5
          done
          if [ "$uploaded" != true ]; then
            echo "::error::could not upload $ASSET; every later run will rebuild PCL"
            exit 1
          fi
          # Drop assets for superseded PCL commits so the release does not grow
          # without bound. Tolerant throughout: a concurrent job may have removed
          # them already, and grep finding nothing is the normal case.
          stale=$(gh release view "$PCL_SDK_TAG" --repo "$GITHUB_REPOSITORY" --json assets \
                    --jq '.assets[].name' 2>/dev/null | { grep -v -- "-${PCL_SHA:0:12}.tar.gz$" || true; })
          for old in $stale; do
            echo "removing superseded $old"
            gh release delete-asset "$PCL_SDK_TAG" "$old" --repo "$GITHUB_REPOSITORY" -y || true
          done
          rm -rf .pcl-sdk

      - name: Build module
        run: node module/build.mjs

      # macOS publishes ONE universal package (arch="all"), because PixInsight's
      # repository format has no arm64 token. Catch a half-built binary here
      # rather than at publish time - scripts/build-pi-repo.mjs refuses it, but
      # by then the release job has already burned three PCL builds.
      - name: Verify the macOS module is universal and signed
        if: runner.os == 'macOS'
        run: |
          dylib=module/build/MCPWatcher-pxm.dylib
          archs=$(lipo -archs "$dylib")
          echo "slices: $archs"
          for want in x86_64 arm64; do
            case " $archs " in
              *" $want "*) ;;
              *) echo "::error::$dylib has no $want slice (got: $archs)"; exit 1 ;;
            esac
          done
          # Apple Silicon will not load unsigned code, build.mjs ad-hoc signs it.
          codesign --verify --verbose "$dylib"

      - name: Upload module artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MCPWatcher-pxm-${{ matrix.os }}
          path: module/build/MCPWatcher-pxm.*
          if-no-files-found: warn
          retention-days: 7
