name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Pin standard Intel macOS runners: arm64 capacity can cancel queued jobs.
        # Apple Silicon is additionally validated locally; see the security review.
        os: [ubuntu-latest, windows-latest, macos-26-intel]
        node: ["22.23.4", "24.22.1", "26.12.1"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      # The server checked the way a client sees it: startup, tool schemas,
      # error paths, probe calls with missing required args. Runs fine without
      # PixInsight, invalid calls are rejected before they reach the bridge.
      - name: Flightcheck the server
        run: npm run test:flightcheck
      # Stale-handler guard: the checked-in generated
      # header must match the watcher JS. Linux only, the generator emits LF
      # and Windows runners' autocrlf would make the diff flaky.
      - name: Stale-handler guard
        if: runner.os == 'Linux' && matrix.node == '24.22.1'
        run: |
          node module/gen-handlers.mjs
          git diff --exit-code module/src/BridgeHandlersJS.h
      # Version bump guard: if module sources changed, module:build (which
      # auto-bumps Version.h via module/version.mjs) must have been run and its
      # bump committed. A dirty diff here means "run node module/build.mjs and
      # commit Version.h + version.lock.json".
      - name: Module version guard
        if: runner.os == 'Linux' && matrix.node == '24.22.1'
        run: |
          node module/version.mjs
          git diff --exit-code module/src/Version.h module/version.lock.json

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: npm run test:security
